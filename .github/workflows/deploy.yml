name: ServiceHub Admin CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: servicehub-admin-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build admin frontend
        run: npm run build

      - name: Trigger server deployment
        if: github.event_name == 'push'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/servicehub_admin_deploy
          chmod 600 ~/.ssh/servicehub_admin_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          timeout 300 ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i ~/.ssh/servicehub_admin_deploy "$SERVER_USER@$SERVER_HOST" \
            '/opt/scripts/deploy-servicehub-admin.sh'
